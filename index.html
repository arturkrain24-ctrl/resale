<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёт перепродажи</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Перепродажа">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: iOS-style ledger — sticky header, dark profit hero, grouped lists, bottom tab bar */
:root{
  --bg:#f3f4f1;--surface:#ffffff;--surface-2:#e8eae5;--ink:#141815;--muted:#6c746e;--line:#e2e5df;
  --accent:#0d8a5c;--accent-soft:#dcf1e6;--neg:#d4443b;--neg-soft:#fbe4e2;
  --hero:#15201a;--hero-ink:#eef5f0;--hero-muted:#9fb3a7;--hero-line:rgba(255,255,255,.08);
  --badge-bg:91%;--badge-fg:30%;--shadow:0 1px 2px rgba(20,30,24,.06),0 4px 14px rgba(20,30,24,.05);
  --font:'Onest',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e0c;--surface:#151a17;--surface-2:#20261f;--ink:#edf1ee;--muted:#8b958e;--line:#242b26;
  --accent:#3fd093;--accent-soft:#13301f;--neg:#ff6a5f;--neg-soft:#3a1715;
  --hero:#18291f;--hero-ink:#eef5f0;--hero-muted:#93a99c;--hero-line:rgba(255,255,255,.07);
  --badge-bg:20%;--badge-fg:78%;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e0c;--surface:#151a17;--surface-2:#20261f;--ink:#edf1ee;--muted:#8b958e;--line:#242b26;
  --accent:#3fd093;--accent-soft:#13301f;--neg:#ff6a5f;--neg-soft:#3a1715;
  --hero:#18291f;--hero-ink:#eef5f0;--hero-muted:#93a99c;--hero-line:rgba(255,255,255,.07);
  --badge-bg:20%;--badge-fg:78%;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 var(--font);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:30px;margin:2px 0 0;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.add{display:flex;align-items:center;gap:6px;height:40px;padding:0 16px 0 12px;border-radius:20px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px}
.add svg{width:18px;height:18px}
.search{margin-top:12px;width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.search::placeholder{color:var(--muted)}
main{padding:6px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto}

.strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.mini .k{font-size:12px;color:var(--muted)}
.mini .v{font-size:18px;font-weight:700;margin-top:2px;letter-spacing:-.01em}

.list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:0}
.item:active{background:var(--surface-2)}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.02em;background:hsl(var(--h) 45% var(--badge-bg));color:hsl(var(--h) 50% var(--badge-fg))}
.body{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--muted);font-size:13px;margin-top:1px}
.r{text-align:right;white-space:nowrap;font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.pill.pos{background:var(--accent-soft);color:var(--accent)}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.zero{background:var(--surface-2);color:var(--muted)}
.age{font-size:12px;font-weight:600;color:var(--muted)}
.age.old{color:var(--neg)}
.pos{color:var(--accent)}.neg{color:var(--neg)}
.empty{text-align:center;color:var(--muted);padding:44px 20px;background:var(--surface);border-radius:16px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:24px;height:24px}
nav button.on{color:var(--accent)}

.chips{display:flex;gap:6px;overflow-x:auto;margin:4px 0 14px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(120deg,transparent 35%,#000);-webkit-mask-image:linear-gradient(120deg,transparent 35%,#000);pointer-events:none}
.hero .k{font-size:13px;color:var(--hero-muted);position:relative}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:4px 0 14px;position:relative}
.hero .big.neg{color:#ff8a80}
.hero .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;border-top:1px solid var(--hero-line);padding-top:12px}
.hero .row div{min-width:0}
.hero .row span{display:block;font-size:12px;color:var(--hero-muted)}
.hero .row b{font-size:15px;font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.card .k{color:var(--muted);font-size:12px}
.card .v{font-size:19px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.wide{grid-column:1/-1}
h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}

.bars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:18px;position:relative}
.bars::before{content:"";position:absolute;left:0;right:0;bottom:20px;border-top:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:2px;opacity:.85}
.bar.cur i{opacity:1}
.bar i.n{background:var(--neg)}
.bar small{font-size:10px;color:var(--muted);margin-top:6px;height:14px}
.bar.cur small{color:var(--ink);font-weight:700}
.bar em{font-size:9px;font-style:normal;color:var(--muted);margin-bottom:3px;white-space:nowrap}

.models{display:flex;flex-direction:column;gap:10px}
.model{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.model-head{display:flex;align-items:center;gap:12px}
.model-head .body .t{font-size:16px}
.share{height:6px;border-radius:3px;background:var(--surface-2);margin:12px 0 10px;overflow:hidden}
.share i{display:block;height:100%;background:var(--accent);border-radius:3px}
.share i.n{background:var(--neg)}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
.mstats span{display:block;font-size:11px;color:var(--muted)}
.mstats b{font-size:14px;font-weight:700;white-space:nowrap}
.mem{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.mem span{font-size:12px;background:var(--surface-2);border-radius:8px;padding:4px 8px;color:var(--muted)}
.mem span b{color:var(--ink);font-weight:600}

.btns{display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--surface);color:var(--ink);font-weight:600;text-align:center}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.note{color:var(--muted);font-size:13px;margin:10px 4px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:640px;margin:0 auto;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h3{margin:0;font-size:17px;font-weight:700}
.link{border:0;background:none;color:var(--accent);font-size:16px;padding:6px 0}
.link.strong{font-weight:700}
.group{margin:0 0 16px}
.group .lbl{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:0 4px 6px}
.fields{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
label.f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
label.f:last-child{border-bottom:0}
label.f span{flex:0 0 auto}
label.f input,label.f select{flex:1;min-width:0;text-align:right;border:0;background:transparent;font-size:16px;padding:2px 0;-webkit-appearance:none;appearance:none;outline-offset:4px}
label.f input::placeholder{color:var(--muted)}
textarea{width:100%;border:0;background:transparent;padding:11px 14px;font-size:16px;min-height:64px;resize:vertical;display:block}
.preview{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 14px;font-weight:700;margin:-4px 0 16px}
.preview.neg{background:var(--neg-soft);color:var(--neg)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><div class="eyebrow" id="eyebrow"></div><h1 id="title">Склад</h1></div>
    <button class="add" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Телефон</button>
  </div>
  <input class="search" id="search" type="search" placeholder="Поиск: модель, цвет, IMEI…" autocomplete="off">
</header>
<main id="main"></main>
<nav>
  <button data-tab="stock" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 5.5h3"/></svg>Склад</button>
  <button data-tab="sold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>Продано</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Статистика</button>
</nav>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="form" autocomplete="off" novalidate>
    <div class="grab"></div>
    <div class="sheet-head">
      <button type="button" class="link" id="cancel">Отмена</button>
      <h3 id="formTitle">Новый телефон</h3>
      <button type="submit" class="link strong">Готово</button>
    </div>
    <div class="group"><div class="lbl">Телефон</div><div class="fields">
      <label class="f"><span>Модель</span><input id="f-model" name="model" list="models" placeholder="iPhone 15 Pro"></label>
      <label class="f"><span>Память</span><select id="f-memory" name="memory"><option></option><option>64 ГБ</option><option>128 ГБ</option><option>256 ГБ</option><option>512 ГБ</option><option>1 ТБ</option></select></label>
      <label class="f"><span>Цвет</span><input id="f-color" name="color" placeholder="—"></label>
      <label class="f"><span>Состояние</span><select id="f-condition" name="condition"><option></option><option>Новый</option><option>Отличное</option><option>Хорошее</option><option>Среднее</option><option>Плохое</option></select></label>
      <label class="f"><span>Батарея, %</span><input id="f-battery" name="battery" type="number" inputmode="numeric" placeholder="—"></label>
      <label class="f"><span>IMEI</span><input id="f-imei" name="imei" inputmode="numeric" placeholder="—"></label>
    </div></div>
    <div class="group"><div class="lbl">Покупка</div><div class="fields">
      <label class="f"><span>Дата</span><input id="f-buyDate" name="buyDate" type="date"></label>
      <label class="f"><span>Цена, ₸</span><input id="f-buyPrice" name="buyPrice" type="number" inputmode="numeric" placeholder="0"></label>
      <label class="f"><span>Расходы, ₸</span><input id="f-costs" name="costs" type="number" inputmode="numeric" placeholder="ремонт, доставка"></label>
      <label class="f"><span>Где купил</span><input id="f-source" name="source" placeholder="OLX, знакомый…"></label>
    </div></div>
    <div class="group"><div class="lbl">Продажа</div><div class="fields">
      <label class="f"><span>Дата</span><input id="f-sellDate" name="sellDate" type="date"></label>
      <label class="f"><span>Цена, ₸</span><input id="f-sellPrice" name="sellPrice" type="number" inputmode="numeric" placeholder="ещё не продан"></label>
    </div></div>
    <div class="preview" id="preview" hidden></div>
    <div class="group"><div class="lbl">Заметка</div><div class="fields">
      <textarea id="f-note" name="note" placeholder="Дефекты, контакт покупателя…"></textarea>
    </div></div>
    <div class="btns"><button type="button" class="btn danger" id="del">Удалить запись</button></div>
  </form>
</div>

<datalist id="models"></datalist>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const KEY='resale.items.v1';
const MODELS=['iPhone 11','iPhone 11 Pro','iPhone 11 Pro Max','iPhone SE (2020)','iPhone 12 mini','iPhone 12','iPhone 12 Pro','iPhone 12 Pro Max','iPhone 13 mini','iPhone 13','iPhone 13 Pro','iPhone 13 Pro Max','iPhone SE (2022)','iPhone 14','iPhone 14 Plus','iPhone 14 Pro','iPhone 14 Pro Max','iPhone 15','iPhone 15 Plus','iPhone 15 Pro','iPhone 15 Pro Max','iPhone 16e','iPhone 16','iPhone 16 Plus','iPhone 16 Pro','iPhone 16 Pro Max','iPhone 17','iPhone Air','iPhone 17 Pro','iPhone 17 Pro Max'];

let items=load(), tab='stock', period='month', modelSort='profit', editId=null, query='', delArmed=false;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)?d:[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){toast('Не удалось сохранить: '+e.message)}}
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n};
const nf=new Intl.NumberFormat('ru-RU');
const fmt=n=>nf.format(Math.round(n||0))+' ₸';
const short=n=>{const a=Math.abs(n),s=n<0?'−':'';if(a>=1e6)return s+(a/1e6).toFixed(1).replace('.0','')+'м';if(a>=1e3)return s+Math.round(a/1e3)+'к';return s+Math.round(a)};
const isSold=i=>!!(i.sellDate&&String(i.sellPrice??'')!=='');
const cost=i=>num(i.buyPrice)+num(i.costs);
const profit=i=>num(i.sellPrice)-cost(i);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const days=(a,b)=>a&&b?Math.max(0,Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5)):0;
const dmy=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(2,4):'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sub=i=>[i.memory,i.color].filter(Boolean).join(' · ');
const signCls=n=>n>0?'pos':n<0?'neg':'zero';
const signed=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m===1?a:m>=2&&m<=4?b:c};

// Model badge: "iPhone 15 Pro Max" → "15PM", colored by generation
function badge(model){
  const m=String(model||'').replace(/iphone/i,'').trim();
  let label='?',h=150;
  const g=m.match(/(\d+)/);
  if(/^se/i.test(m)){label='SE';h=200}
  else if(/^air/i.test(m)){label='Air';h=190}
  else if(g){label=g[1]+(/pro max/i.test(m)?'PM':/pro/i.test(m)?'P':/plus/i.test(m)?'+':/mini/i.test(m)?'m':/\d+e\b/i.test(m)?'e':'');h=(Number(g[1])*47+120)%360}
  else if(m){label=m.slice(0,3)}
  return `<span class="badge" style="--h:${h}">${esc(label)}</span>`;
}

const $=s=>document.querySelector(s);
const main=$('#main'), form=$('#form'), overlay=$('#overlay');
$('#models').innerHTML=MODELS.map(m=>`<option value="${m}">`).join('');

let toastT;
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

function matches(i){if(!query)return true;const q=query.toLowerCase();return [i.model,i.memory,i.color,i.imei,i.note,i.source,i.condition].some(v=>String(v||'').toLowerCase().includes(q))}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#title').textContent={stock:'Склад',sold:'Продано',stats:'Статистика'}[tab];
  $('#eyebrow').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  $('#search').hidden=tab==='stats';
  if(tab==='stock')renderStock();else if(tab==='sold')renderSold();else renderStats();
}

function renderStock(){
  const all=items.filter(i=>!isSold(i));
  const list=all.filter(matches).sort((a,b)=>(b.buyDate||'').localeCompare(a.buyDate||''));
  const invested=all.reduce((s,i)=>s+cost(i),0);
  const avgAge=all.length?all.reduce((s,i)=>s+days(i.buyDate,today()),0)/all.length:0;
  let h=`<div class="strip"><div class="mini"><div class="k">На складе</div><div class="v">${all.length} шт</div></div><div class="mini"><div class="k">Вложено</div><div class="v">${fmt(invested)}</div></div></div>`;
  if(!list.length)h+=all.length?`<div class="empty">Ничего не найдено</div>`:`<div class="empty"><b>Склад пуст</b>Нажми «Телефон», чтобы добавить купленный айфон.</div>`;
  else h+='<div class="list">'+list.map(i=>{const d=days(i.buyDate,today());return `<button class="item" data-id="${i.id}">${badge(i.model)}<div class="body"><div class="t">${esc(i.model)}</div><div class="s">${esc(sub(i))}${sub(i)?' · ':''}куплен ${dmy(i.buyDate)}${i.battery?' · АКБ '+esc(i.battery)+'%':''}</div></div><div class="r">${fmt(cost(i))}<div class="age ${d>14?'old':''}">${d} ${plural(d,'день','дня','дней')}</div></div></button>`}).join('')+'</div>';
  if(all.length)h+=`<div class="note">Средний срок на складе: ${avgAge.toFixed(0)} ${plural(Math.round(avgAge),'день','дня','дней')}. Красным отмечены телефоны, которые лежат дольше двух недель.</div>`;
  main.innerHTML=h;
}

function renderSold(){
  const all=items.filter(isSold);
  const list=all.filter(matches).sort((a,b)=>(b.sellDate||'').localeCompare(a.sellDate||''));
  const pr=all.reduce((s,i)=>s+profit(i),0);
  let h=`<div class="strip"><div class="mini"><div class="k">Продано всего</div><div class="v">${all.length} шт</div></div><div class="mini"><div class="k">Прибыль всего</div><div class="v ${signCls(pr)}">${signed(pr)}</div></div></div>`;
  if(!list.length)h+=all.length?`<div class="empty">Ничего не найдено</div>`:`<div class="empty"><b>Продаж пока нет</b>Открой телефон на складе и укажи цену продажи.</div>`;
  else h+='<div class="list">'+list.map(i=>{const p=profit(i);return `<button class="item" data-id="${i.id}">${badge(i.model)}<div class="body"><div class="t">${esc(i.model)}${i.memory?' · '+esc(i.memory):''}</div><div class="s">${short(cost(i))} → ${short(num(i.sellPrice))} · ${dmy(i.sellDate)} · ${days(i.buyDate,i.sellDate)} дн.</div></div><span class="pill ${signCls(p)}">${signed(p)}</span></button>`}).join('')+'</div>';
  main.innerHTML=h;
}

function inPeriod(s,p){
  if(p==='all')return true;if(!s)return false;
  const d=new Date(s+'T00:00'),n=new Date();
  if(p==='month')return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
  if(p==='prev'){const m=new Date(n.getFullYear(),n.getMonth()-1,1);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth()}
  if(p==='year')return d.getFullYear()===n.getFullYear();
}

function renderStats(){
  const P={month:'Этот месяц',prev:'Прошлый месяц',year:'Этот год',all:'Всё время'};
  const sold=items.filter(isSold).filter(i=>inPeriod(i.sellDate,period));
  const bought=items.filter(i=>inPeriod(i.buyDate,period));
  const stock=items.filter(i=>!isSold(i));
  const rev=sold.reduce((s,i)=>s+num(i.sellPrice),0);
  const pr=sold.reduce((s,i)=>s+profit(i),0);
  const cs=sold.reduce((s,i)=>s+cost(i),0);
  const avgP=sold.length?pr/sold.length:0;
  const margin=cs?pr/cs*100:0;
  const avgD=sold.length?sold.reduce((s,i)=>s+days(i.buyDate,i.sellDate),0)/sold.length:0;
  const best=sold.slice().sort((a,b)=>profit(b)-profit(a))[0];

  let h=`<div class="chips">${Object.entries(P).map(([k,v])=>`<button class="chip ${k===period?'on':''}" data-p="${k}">${v}</button>`).join('')}</div>`;
  h+=`<div class="hero"><div class="k">Прибыль · ${P[period].toLowerCase()}</div><div class="big ${pr<0?'neg':''}">${signed(pr)}</div>
    <div class="row"><div><span>Выручка</span><b>${short(rev)} ₸</b></div><div><span>Продано</span><b>${sold.length} шт</b></div><div><span>Наценка</span><b>${margin.toFixed(1)}%</b></div></div></div>`;
  h+=`<div class="grid">
    <div class="card"><div class="k">Средняя прибыль</div><div class="v ${avgP<0?'neg':''}">${fmt(avgP)}</div></div>
    <div class="card"><div class="k">Продаётся за</div><div class="v">${avgD.toFixed(1)} дн.</div></div>
    <div class="card"><div class="k">Куплено</div><div class="v">${bought.length} шт</div></div>
    <div class="card"><div class="k">На складе</div><div class="v">${stock.length} шт</div></div>
    ${best?`<div class="card wide"><div class="k">Лучшая сделка</div><div class="v" style="font-size:16px">${esc(best.model)}${best.memory?' · '+esc(best.memory):''} <span class="pos">${signed(profit(best))}</span></div></div>`:''}
  </div>`;

  // Per-model stats
  const g={};
  const key=i=>String(i.model||'Без модели').trim();
  sold.forEach(i=>{const k=key(i);g[k]=g[k]||{sold:[],stock:0,mem:{}};g[k].sold.push(i);const m=i.memory||'—';g[k].mem[m]=(g[k].mem[m]||0)+1});
  stock.forEach(i=>{const k=key(i);g[k]=g[k]||{sold:[],stock:0,mem:{}};g[k].stock++});
  const rows=Object.entries(g).map(([k,v])=>{const n=v.sold.length,p=v.sold.reduce((s,i)=>s+profit(i),0),c=v.sold.reduce((s,i)=>s+cost(i),0);
    return {k,n,p,stock:v.stock,mem:v.mem,avgBuy:n?c/n:0,avgSell:n?v.sold.reduce((s,i)=>s+num(i.sellPrice),0)/n:0,avgP:n?p/n:0,avgD:n?v.sold.reduce((s,i)=>s+days(i.buyDate,i.sellDate),0)/n:0,margin:c?p/c*100:0}});
  rows.sort(modelSort==='profit'?(a,b)=>b.p-a.p||b.n-a.n:modelSort==='count'?(a,b)=>b.n-a.n||b.p-a.p:(a,b)=>(a.n?a.avgD:1e9)-(b.n?b.avgD:1e9));
  const maxP=Math.max(1,...rows.map(r=>Math.abs(r.p)));
  h+=`<h2>По моделям <small>${rows.length} ${plural(rows.length,'модель','модели','моделей')}</small></h2>`;
  if(rows.length){
    h+=`<div class="chips">${[['profit','По прибыли'],['count','По продажам'],['speed','Быстрее продаются']].map(([k,v])=>`<button class="chip ${k===modelSort?'on':''}" data-ms="${k}">${v}</button>`).join('')}</div><div class="models">`;
    h+=rows.map(r=>`<div class="model"><div class="model-head">${badge(r.k)}<div class="body"><div class="t">${esc(r.k)}</div><div class="s">продано ${r.n} · на складе ${r.stock}</div></div>${r.n?`<span class="pill ${signCls(r.p)}">${signed(r.p)}</span>`:''}</div>
      ${r.n?`<div class="share"><i class="${r.p<0?'n':''}" style="width:${Math.abs(r.p)/maxP*100}%"></i></div>
      <div class="mstats"><div><span>Ср. покупка</span><b>${short(r.avgBuy)} ₸</b></div><div><span>Ср. продажа</span><b>${short(r.avgSell)} ₸</b></div><div><span>Ср. прибыль</span><b class="${r.avgP<0?'neg':''}">${short(r.avgP)} ₸</b></div><div><span>Наценка</span><b>${r.margin.toFixed(1)}%</b></div><div><span>Срок продажи</span><b>${r.avgD.toFixed(0)} дн.</b></div><div><span>Продано</span><b>${r.n} шт</b></div></div>
      <div class="mem">${Object.entries(r.mem).map(([m,c])=>`<span>${esc(m)} <b>×${c}</b></span>`).join('')}</div>`:`<div class="s" style="margin-top:10px">За этот период продаж не было</div>`}</div>`).join('')+'</div>';
  } else h+=`<div class="empty">Добавь телефоны, и здесь появится разбивка по моделям.</div>`;

  // last 12 months
  const n=new Date(),months=[];
  for(let k=11;k>=0;k--){const d=new Date(n.getFullYear(),n.getMonth()-k,1);const mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    months.push({cur:k===0,lbl:d.toLocaleString('ru-RU',{month:'short'}).replace('.','').slice(0,3),v:items.filter(i=>isSold(i)&&i.sellDate.slice(0,7)===mk).reduce((s,i)=>s+profit(i),0)})}
  const mx=Math.max(1,...months.map(m=>Math.abs(m.v)));
  h+=`<h2>Прибыль по месяцам <small>12 мес.</small></h2><div class="card"><div class="bars">${months.map(m=>`<div class="bar ${m.cur?'cur':''}"><em>${m.v?short(m.v):''}</em><i class="${m.v<0?'n':''}" style="height:calc(${Math.abs(m.v)/mx} * (100% - 40px))"></i><small>${m.lbl}</small></div>`).join('')}</div></div>`;

  h+=`<h2>Данные</h2><div class="btns">
    <button class="btn" id="expJson">Сохранить резервную копию</button>
    <button class="btn" id="impJson">Загрузить из копии</button>
    <button class="btn" id="expCsv">Выгрузить таблицу (CSV)</button>
  </div>
  <div class="note">Все данные хранятся только на этом телефоне. Время от времени сохраняй резервную копию в Файлы или Telegram.</div>`;
  main.innerHTML=h;
}

// ---- form ----
function setDel(armed){delArmed=armed;const b=$('#del');b.classList.toggle('armed',armed);b.textContent=armed?'Нажми ещё раз, чтобы удалить':'Удалить запись'}
function openForm(id){
  editId=id||null;form.reset();setDel(false);
  const i=items.find(x=>x.id===id);
  $('#formTitle').textContent=i?'Изменить':'Новый телефон';
  $('#del').hidden=!i;
  if(i){for(const el of form.elements)if(el.name&&i[el.name]!=null)el.value=i[el.name]}
  else form.buyDate.value=today();
  updatePreview();overlay.hidden=false;document.body.style.overflow='hidden';
}
function closeForm(){overlay.hidden=true;document.body.style.overflow='';editId=null}
function updatePreview(){
  const sp=form.sellPrice.value,pv=$('#preview');
  if(sp===''){pv.hidden=true;return}
  const p=num(sp)-num(form.buyPrice.value)-num(form.costs.value);
  pv.hidden=false;pv.className='preview'+(p<0?' neg':'');
  pv.innerHTML=`<span>Прибыль с продажи</span><span>${signed(p)}</span>`;
}
form.addEventListener('input',e=>{if(['sellPrice','buyPrice','costs'].includes(e.target.name))updatePreview()});
form.sellPrice.addEventListener('change',()=>{if(form.sellPrice.value!==''&&!form.sellDate.value)form.sellDate.value=today()});
form.addEventListener('submit',e=>{
  e.preventDefault();
  const d={};for(const el of form.elements)if(el.name)d[el.name]=el.value.trim();
  if(!d.model){toast('Укажи модель');form.model.focus();return}
  if(d.buyPrice===''){toast('Укажи цену покупки');form.buyPrice.focus();return}
  if(!d.buyDate)d.buyDate=today();
  if(d.sellPrice!==''&&!d.sellDate)d.sellDate=today();
  if(d.sellDate&&d.sellPrice===''){toast('Укажи цену продажи или очисти дату продажи');return}
  const wasSold=editId&&isSold(items.find(x=>x.id===editId)||{});
  if(editId){const i=items.findIndex(x=>x.id===editId);items[i]={...items[i],...d}}
  else items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),...d});
  save();closeForm();render();
  toast(isSold(d)&&!wasSold?`Продано, прибыль ${signed(profit(d))}`:'Сохранено');
});
$('#del').onclick=()=>{if(!editId)return;if(!delArmed)return setDel(true);items=items.filter(x=>x.id!==editId);save();closeForm();render();toast('Запись удалена')};
$('#cancel').onclick=closeForm;
overlay.addEventListener('click',e=>{if(e.target===overlay)closeForm()});
$('#addBtn').onclick=()=>openForm();

// ---- navigation & clicks ----
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.tab;window.scrollTo(0,0);render()}});
$('#search').addEventListener('input',e=>{query=e.target.value.trim();render()});
main.addEventListener('click',e=>{
  const it=e.target.closest('.item[data-id]');if(it)return openForm(it.dataset.id);
  const c=e.target.closest('.chip');
  if(c&&c.dataset.p){period=c.dataset.p;return render()}
  if(c&&c.dataset.ms){modelSort=c.dataset.ms;return render()}
  if(e.target.id==='expJson')return shareFile(`perepr-backup-${today()}.json`,JSON.stringify(items,null,1),'application/json');
  if(e.target.id==='expCsv')return exportCsv();
  if(e.target.id==='impJson')return $('#importFile').click();
});

// ---- import / export ----
async function shareFile(fname,content,type){
  const file=new File([content],fname,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}
  }
  try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}catch(e){}
  toast('Если файл не сохранился, открой приложение с экрана «Домой»');
}
function exportCsv(){
  const cols=[['model','Модель'],['memory','Память'],['color','Цвет'],['condition','Состояние'],['battery','Батарея %'],['imei','IMEI'],['buyDate','Дата покупки'],['buyPrice','Цена покупки'],['costs','Расходы'],['source','Где купил'],['sellDate','Дата продажи'],['sellPrice','Цена продажи'],['profit','Прибыль'],['days','Дней до продажи'],['note','Заметка']];
  const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=items.map(i=>cols.map(([k])=>q(k==='profit'?(isSold(i)?profit(i):''):k==='days'?(isSold(i)?days(i.buyDate,i.sellDate):''):i[k])).join(';'));
  shareFile(`perepr-${today()}.csv`,'﻿'+[cols.map(c=>c[1]).join(';'),...rows].join('\n'),'text/csv');
}
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data))throw new Error('неверный формат');
    const map=new Map(items.map(i=>[i.id,i]));let added=0;
    data.forEach(i=>{if(i&&i.id&&i.model){if(!map.has(i.id))added++;map.set(i.id,i)}});
    items=[...map.values()];save();render();
    toast(`Загружено. Новых записей: ${added}, всего: ${items.length}`);
  }catch(err){toast('Не удалось загрузить файл: '+err.message)}
});

// ---- offline ----
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

render();
</script>
